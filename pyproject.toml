[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subalign"
version = "0.1.0"
description = "Align subtitle timelines to a video's audio track"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]

[project.scripts]
subalign = "subalign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: requires whisper.cpp and a local GGML model"]
